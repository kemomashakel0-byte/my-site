<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Place</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:#ffffff;color:#333}
header{position:sticky;top:0;z-index:1000;background:#0a2540;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
header .brand{display:flex;align-items:center;gap:12px}
header img{height:42px;width:42px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid white}
header h1{font-size:20px;font-weight:700}
.whatsapp-btn{background:#25D366;color:white;padding:9px 16px;border-radius:25px;text-decoration:none;font-weight:700;font-size:14px}
.hidden{display:none}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:#0a2540;padding:20px}
.login-box{background:white;padding:35px;border-radius:15px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.login-box h2{text-align:center;margin-bottom:25px;color:#0a2540}
.login-box input{width:100%;padding:15px;margin:12px 0;border:2px solid #ddd;border-radius:10px;font-size:17px}
.login-box button{width:100%;padding:15px;background:#1e4d8b;color:white;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
.login-box button:last-child{background:#6c757d;font-size:15px}
.container{max-width:1100px;margin:25px auto;padding:15px}
.product-page{background:white;padding:25px;border-radius:15px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.product-page img{width:100%;max-width:420px;border-radius:15px;margin-bottom:15px}
.product-page h2{font-size:28px;margin:15px 0}
.price{font-size:30px;color:#1e4d8b;font-weight:700;margin:10px 0}
.product-page button{width:100%;max-width:420px;padding:18px;background:#1e4d8b;color:white;border:none;border-radius:50px;font-size:20px;font-weight:700;margin-top:18px;cursor:pointer;transition:0.3s}
.product-page button:hover{background:#153a66}
form{max-width:500px;margin:20px auto 0}
form input{width:100%;padding:16px;margin:12px 0;border:2px solid #ddd;border-radius:12px;font-size:18px}
.total-box{margin-top:18px;padding:18px;background:#f8f9fa;border-radius:12px;font-size:19px;border:2px solid #1e4d8b}
.total-box small{display:block;margin-top:8px;color:#666;font-size:15px}
.order-card{background:#f9f9f9;padding:18px;margin:12px 0;border-radius:12px;border:2px solid #ddd}
.order-card b{color:#0a2540;font-size:18px}
.order-card input{width:120px;padding:8px;margin:5px;border-radius:6px;border:1px solid #ccc;font-size:16px}
@media(max-width:600px){
  header{padding:10px 15px}
  header h1{font-size:16px}
  header img{height:36px;width:36px}
  .product-page{padding:15px}
  .product-page h2{font-size:22px}
  .price{font-size:24px}
  .product-page button{font-size:18px;padding:15px}
  form input{font-size:16px;padding:14px}
  .login-box{padding:25px}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>🔐 دخول لوحة التحكم</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة السر">
    <button onclick="login()">دخول</button>
    <button onclick="alert('للاسترجاع كلم الدعم الفني على واتساب')">هل نسيت كلمة السر؟</button>
    <p style="margin-top:15px;font-size:13px;color:#999;text-align:center">اليوزر: kareem | الباس: kemomashakel251</p>
  </div>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
<header>
  <div class="brand">
    <img id="storeLogo" src="https://via.placeholder.com/42/1e4d8b/ffffff?text=YP" onclick="changeLogo()" title="دوس لتغيير اللوجو">
    <h1>Your Place</h1>
  </div>
  <a href="https://wa.me/2010" target="_blank" class="whatsapp-btn">تواصل معنا</a>
</header>

<!-- واجهة العميل -->
<div class="container" id="customerView">
  <div class="product-page">
    <img id="prodImage" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500">
    <h2 id="prodName">سماعة لاسلكية</h2>
    <p class="price"><span id="prodPrice">350</span> جنيه</p>
    <button onclick="showForm()">اطلب الآن</button>
    
    <div id="orderForm" class="hidden">
      <h3 style="margin-top:25px;margin-bottom:15px">بيانات الطلب</h3>
      <form onsubmit="submitOrder(event)">
        <input type="text" placeholder="الاسم" id="cName" required>
        <input type="tel" placeholder="رقم الموبايل" id="cPhone" required>
        <input type="text" placeholder="العنوان" id="cAddress" required>
        <input type="number" placeholder="الكمية" id="cQty" value="1" min="1" required oninput="calcTotal()">
        <div class="total-box">
          الإجمالي: <span id="total">350</span> جنيه
          <small>يضاف مصاريف الشحن حسب العنوان</small>
        </div>
        <button type="submit">تأكيد الطلب</button>
      </form>
    </div>
  </div>
</div>

<!-- لوحة التحكم -->
<div class="container hidden" id="adminView">
  <button onclick="logout()" style="background:#dc3545;color:white;padding:10px 18px;border:none;border-radius:8px;margin-bottom:20px;font-weight:700;cursor:pointer">خروج</button>
  <h2 style="margin-bottom:20px;color:#0a2540">لوحة التحكم - الطلبات الواردة</h2>
  <div id="ordersList">لا يوجد طلبات حتى الآن</div>
</div>

</div>

<script>
const USER = "kareem";
const PASS = "kemomashakel251";
let orders = JSON.parse(localStorage.getItem('orders')) || [];

function login(){
  let u = document.getElementById('username').value.trim();
  let p = document.getElementById('password').value.trim();
  if(u===USER && p===PASS){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('adminView').classList.remove('hidden');
    document.getElementById('customerView').classList.add('hidden');
    showOrders();
  } else {
    alert("اسم المستخدم أو كلمة السر غلط ❌");
  }
}

function logout(){
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('customerView').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('username').value = "";
  document.getElementById('password').value = "";
}

function showForm(){
  document.getElementById('orderForm').classList.remove('hidden');
  calcTotal();
}

function calcTotal(){
  let price = parseInt(document.getElementById('prodPrice').innerText) || 0;
  let qty = parseInt(document.getElementById('cQty').value) || 1;
  document.getElementById('total').innerText = price * qty;
}

function submitOrder(e){
  e.preventDefault();
  let order = {
    id: Date.now(),
    name: document.getElementById('cName').value,
    phone: document.getElementById('cPhone').value,
    address: document.getElementById('cAddress').value,
    qty: parseInt(document.getElementById('cQty').value),
    product: document.getElementById('prodName').innerText,
    price: parseInt(document.getElementById('prodPrice').innerText),
    subtotal: parseInt(document.getElementById('prodPrice').innerText) * parseInt(document.getElementById('cQty').value),
    shipping: 0
  };
  orders.push(order);
  localStorage.setItem('orders', JSON.stringify(orders));
  alert("تم استلام طلبك بنجاح ✅\nهنكلمك واتساب للتأكيد ومصاريف الشحن");
  e.target.reset();
  document.getElementById('orderForm').classList.add('hidden');
}

function showOrders(){
  let div = document.getElementById('ordersList');
  if(orders.length===0){
    div.innerHTML='<p style="text-align:center;color:#999;padding:30px">لا يوجد طلبات حتى الآن</p>';
    return;
  }
  div.innerHTML = orders.map(o=>`
    <div class="order-card">
      <b>${o.name}</b> - ${o.phone}<br><br>
      المنتج: ${o.product} × ${o.qty}<br>
      العنوان: ${o.address}<br>
      السعر الفرعي: ${o.subtotal} جنيه<br>
      مصاريف الشحن: <input type="number" value="${o.shipping}" min="0" onchange="updateShipping(${o.id},this.value)"> جنيه<br><br>
      <b>الإجمالي النهائي: ${o.subtotal + parseInt(o.shipping||0)} جنيه</b>
    </div>
  `).join('');
}

function updateShipping(id,val){
  orders = orders.map(o=>o.id==id?{...o,shipping:parseInt(val)||0}:o);
  localStorage.setItem('orders', JSON.stringify(orders));
  showOrders();
}

function changeLogo(){
  let url = prompt("الصق رابط الصورة الجديدة للوجو:");
  if(url && url.startsWith('http')) {
    document.getElementById('storeLogo').src = url;
  } else if(url) {
    alert("الرابط لازم يبدأ بـ http");
  }
}
</script>
</body>
</html>
